<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Site - GitHub Pages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      border-radius: 1rem;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid #1f2937;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
    }
    p {
      margin: 0.25rem 0;
      color: #9ca3af;
    }
    .tag {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Domain Test Successful</h1>
    <p>If you can see this page, your GitHub Pages setup works.</p>
    <p>Repo: <strong>username.github.io</strong> or <strong>your‑custom‑domain</strong></p>
    <p class="tag">Served via GitHub Pages</p>
  </div>
</body>
</html>
