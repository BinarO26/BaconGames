<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BaconAI</title>
<link rel="icon" type="image/png" href="../logo.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #0a1628);
    color: #fff;
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
  }

  nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    padding: 6px 8px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  nav a {
    color: rgba(255,255,255,.5);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 999px;
    transition: all .2s ease;
    white-space: nowrap;
  }
  nav a:hover { color: #fff; background: rgba(255,255,255,.1); transform: translateY(-1px); }
  nav a.active { color: #000; background: #fff; font-weight: 600; }
  nav a.active:hover { transform: none; }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
    text-align: center;
    padding: 40px;
  }

  .hero .icon {
    font-size: 64px;
    opacity: .6;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .hero h1 {
    font-size: clamp(36px, 7vw, 72px);
    font-weight: 700;
    letter-spacing: 2px;
  }

  .hero .tag {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid rgba(57,255,158,.3);
    color: #39ff9e;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .hero p {
    color: rgba(255,255,255,.4);
    font-size: 16px;
    max-width: 400px;
    margin-top: 4px;
  }

  footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: rgba(255,255,255,.25);
  }
</style>
</head>
<body>

<nav>
  <a href="https://binaro26.github.io/bacongames/">Home</a>
  <a href="https://binaro26.github.io/bacongames/games">Games</a>
  <a href="https://binaro26.github.io/bacongames/ai" class="active">BaconAI</a>
  <a href="https://binaro26.github.io/bacongames/info">Information</a>
  <a href="https://binaro26.github.io/bacongames/settings">Settings</a>
</nav>

<div class="hero">
  <div class="icon">&#129363;</div>
  <span class="tag">Coming Soon</span>
  <h1>BaconAI</h1>
  <p>Your personal AI assistant — powered by open-source intelligence. Launching soon.</p>
</div>

<footer>Created by Pausuu & Binaro26</footer>

</body>
</html>
