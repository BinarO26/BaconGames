<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BaconGames</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, #2a0a5e, #120a8f, #3b0f7f, #0a1a6a);
    background-size: 300% 300%;
    animation: gradientShift 8s ease infinite;
    color: #e5e5e5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  nav {
    background: rgba(10, 10, 20, 0.45);
    backdrop-filter: blur(12px);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    animation: fadeIn 1.2s ease forwards;
  }
  nav .logo a {
    font-weight: 600;
    font-size: 1.25rem;
    color: #fff;
    text-decoration: none;
  }
  nav .links a {
    margin-left: 1.5rem;
    text-decoration: none;
    color: #cfcfcf;
    font-size: 0.95rem;
    transition: 0.25s;
  }
  nav .links a:hover {
    color: #fff;
    transform: translateY(-2px);
  }

  .hero {
    text-align: center;
    padding: 4rem 1rem 2rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: fadeIn 1.4s ease forwards;
  }
  .hero h1 {
    font-size: 4.4rem;
    margin-bottom: 0.75rem;
    font-weight: 800;
    letter-spacing: -1.5px;
    animation: fadeIn 1.6s ease forwards;
  }
  .hero p {
    color: #c0c0c0;
    max-width: 600px;
    margin: 0 auto;
    font-size: 1.2rem;
    line-height: 1.6;
    animation: fadeIn 1.8s ease forwards;
  }

  .start-btn {
    display: inline-block;
    margin: 2.4rem auto 0 auto;
    padding: 1rem 1.8rem;
    background: #6a3df5;
    color: white;
    border-radius: 0.55rem;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 600;
    transition: 0.3s ease;
    width: fit-content;
    box-shadow: 0 0 14px rgba(106, 61, 245, 0.45);
    animation: fadeIn 2s ease forwards;
  }
  .start-btn:hover {
    background: #7a4cff;
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 0 22px rgba(122, 76, 255, 0.6);
  }
</style>
</head>
<body>

<nav>
  <div class="logo">
    <a href="https://binaro26.github.io/bacongames/">BaconGames</a>
  </div>
  <div class="links">
    <a href="https://binaro26.github.io/bacongames/">Home</a>
    <a href="https://binaro26.github.io/bacongames/games/">Games</a>
    <a href="https://binaro26.github.io/bacongames/about/">About</a>
    <a href="https://binaro26.github.io/bacongames/emulators/">Emulators</a>
    <a href="https://binaro26.github.io/bacongames/settings/">Settings</a>
  </div>
</nav>

<div class="hero">
  <h1>Welcome to BaconGames</h1>
  <p>A fast, curated portal for playing HTML games — built to be simple, safe, and enjoyable.</p>

  <a class="start-btn" href="https://binaro26.github.io/bacongames/games/">Get Started</a>
</div>

</body>
</html>
