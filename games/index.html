<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BaconGames – Games Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* BACKGROUND — Strong Purple + Deep Blue + Faster Animation */
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, #2a0a5e, #120a8f, #3b0f7f, #0a1a6a);
    background-size: 300% 300%;
    animation: gradientShift 8s ease infinite;
    color: #e5e5e5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* NAVBAR */
  nav {
    background: rgba(10, 10, 20, 0.45);
    backdrop-filter: blur(12px);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  nav .logo a {
    font-weight: 600;
    font-size: 1.25rem;
    color: #fff;
    text-decoration: none;
  }
  nav .links a {
    margin-left: 1.5rem;
    text-decoration: none;
    color: #cfcfcf;
    font-size: 0.95rem;
    transition: 0.25s;
  }
  nav .links a:hover {
    color: #fff;
    transform: translateY(-2px);
  }

  /* PAGE CONTENT */
  .content {
    padding: 2rem;
    flex: 1;
  }

  /* SEARCH BAR */
  .search-container {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 1.5rem;
  }
  .search-container input {
    padding: 0.7rem 1rem;
    width: 260px;
    border-radius: 0.4rem;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 0.95rem;
    backdrop-filter: blur(6px);
  }

  /* GAME GRID */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1.5rem;
  }

  .game-card {
    background: rgba(255,255,255,0.08);
    padding: 1rem;
    border-radius: 0.6rem;
    text-align: center;
    backdrop-filter: blur(8px);
    transition: 0.25s;
  }
  .game-card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.12);
  }

  .game-card img {
    width: 100%;
    border-radius: 0.4rem;
    margin-bottom: 0.6rem;
  }

  .game-card h3 {
    margin: 0;
    font-size: 1rem;
    color: #fff;
  }
</style>

<script>
  // SIMPLE SEARCH FUNCTION
  function searchGames() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const cards = document.getElementsByClassName("game-card");

    for (let card of cards) {
      const title = card.getAttribute("data-title").toLowerCase();
      card.style.display = title.includes(input) ? "block" : "none";
    }
  }
</script>

</head>
<body>

<nav>
  <div class="logo">
    <a href="https://binaro26.github.io/BaconGames/">BaconGames</a>
  </div>
  <div class="links">
    <a href="https://binaro26.github.io/BaconGames/">Home</a>
    <a href="https://binaro26.github.io/BaconGames/games">Games</a>
    <a href="https://binaro26.github.io/BaconGames/utills">Utilities</a>
    <a href="https://binaro26.github.io/BaconGames/ai">BaconAI</a>
    <a href="https://binaro26.github.io/BaconGames/browser">Browser</a>
    <a href="https://binaro26.github.io/BaconGames/about">About</a>
    <a href="https://binaro26.github.io/BaconGames/settings">Settings</a>
  </div>
</nav>

<div class="content">

  <!-- SEARCH BAR -->
  <div class="search-container">
    <input id="searchInput" onkeyup="searchGames()" type="text" placeholder="Search Games...">
  </div>

  <!-- GAMES GRID -->
  <div class="games-grid">

    <!-- ONE EXAMPLE GAME -->
    <div class="game-card" data-title="1v1.lol">
      <img src="https://via.placeholder.com/150x100.png?text=Game+Thumbnail" alt="Game Thumbnail">
      <h3>1v1.lol</h3>
    </div>

  </div>

</div>

</body>
</html>
